# Fly.io deployment config — https://fly.io/docs
#
# Setup:
#   1. fly launch --no-deploy
#   2. fly volumes create enphera_data --region sjc --size 1
#   3. fly secrets set ADMIN_PIN=1234 SESSION_SECRET=$(openssl rand -hex 32) \
#        DATABASE_URL=file:/data/enphera.db CONTENT_DIR=/data/content NODE_ENV=production
#   4. (one-time) fly ssh console -C "mkdir -p /data/content && cp -r content/* /data/content/"
#   5. fly deploy
#   6. fly open

app = "enphera-compendium"  # ← change to your app name
primary_region = "sjc"

[build]

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = false     # don't auto-stop — we need the SQLite file + session to persist
auto_start_machines = false
min_machines_running = 1

# Persistent volume mount — keeps SQLite db AND content/ directory between deploys.
[[mounts]]
source = "enphera_data"
destination = "/data"

[vm]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
